[project]
name = "aura-common"
version = "0.1.0"
description = "Cross-cutting primitives: config, logging, db session, error taxonomy"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Proprietary" }
authors = [{ name = "Aura Desk Platform Team", email = "platform@aura-desk.io" }]
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "anyio>=4.6,<5.0",
]

[tool.poetry]
# No explicit `packages`: Poetry auto-detects the src/ layout
# (src/aura_common) from the project name. Declaring it manually here makes
# Poetry also apply the auto-detected entry, yielding a doubled src/src path.

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
